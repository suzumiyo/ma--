<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>麻辣湯カスタマイザー</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;background:#f7f1ea;color:#2a211c}
main{max-width:760px;margin:auto;padding:16px 12px 40px}
h1{font-size:24px;margin:4px 0 6px}
p{color:#75685f;font-size:13px;line-height:1.5}
.card{background:#fff;border:1px solid #e2d7cd;border-radius:18px;padding:14px;margin-top:12px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:#f2e8df;border-radius:14px;padding:10px}
.box span{font-size:11px;color:#7e7167;display:block}
.box b{font-size:22px;display:block;margin-top:2px}
.price b{color:#a83a2c}
.bowl{margin:10px auto 14px;width:min(100%,360px);aspect-ratio:1.45/1;border-radius:50%;background:#e7d8cc;padding:9%;box-shadow:inset 0 -12px 0 #bca99a}
.soup{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#df6c4e,#c64c37 70%,#9f3025);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:14px;overflow:hidden}
.food{font-size:30px;line-height:1}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.tab{border:1px solid #ddd1c6;background:#fff;border-radius:999px;min-height:44px;padding:0 14px;font-weight:700;white-space:nowrap}
.tab.on{background:#a83a2c;color:white;border-color:#a83a2c}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.item{border:1px solid #ded3c9;background:#fff;border-radius:16px;min-height:105px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.item.on{border:2px solid #a83a2c;background:#fff7f4}
.emoji{font-size:38px}
.name{font-size:13px;font-weight:800;margin-top:4px}
.g{font-size:10px;color:#7f7268;margin-top:2px}
.count{font-size:10px;color:#a83a2c;font-weight:800;margin-top:4px}
.rows{margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee6df;padding:8px 0;gap:8px}
.rowname{font-size:13px;font-weight:700}
.rowname small{display:block;color:#80736a;font-weight:400}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:50%;border:1px solid #ddd1c6;background:#fff;font-size:20px}
.step b{min-width:22px;text-align:center}
select{width:100%;min-height:46px;border:1px solid #ddd1c6;border-radius:12px;background:#fff;font-size:16px;padding:0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
label{font-size:11px;font-weight:800;display:block;margin-bottom:4px}
.details{font-size:12px;line-height:1.7;color:#766a60;margin:10px 0}
.notice{font-size:12px;background:#fff0d4;border-radius:12px;padding:9px}
.notice.ok{background:#e7f3e7}
.reset{width:100%;min-height:46px;border:1px solid #ddd1c6;border-radius:12px;background:#fff;color:#a83a2c;font-weight:800;margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>わたしの麻辣湯 🍜</h1>
  <p>具材をタップすると、丼・グラム・金額が変わります。</p>

  <section class="card">
    <div class="bowl"><div id="soup" class="soup"><span style="color:white;font-size:13px">具材を選んでね</span></div></div>

    <div class="summary">
      <div class="box"><span>トッピング重量</span><b id="weight">0g</b></div>
      <div class="box price"><span>合計</span><b id="price">¥620</b></div>
    </div>

    <div id="details" class="details">スープ＋春雨 ¥620<br>トッピング ¥0</div>
    <div id="notice" class="notice">20g以上になるように選んでね。あと20g。</div>

    <div class="opts">
      <div>
        <label>辛さ</label>
        <select id="spice">
          <option value="0">0番 白湯</option>
          <option value="0">1番 ピリ辛</option>
          <option value="0" selected>2番 中辛</option>
          <option value="0">3番 大辛</option>
          <option value="88">4番 激辛 ＋¥88</option>
          <option value="176">5番 極辛 ＋¥176</option>
        </select>
      </div>
      <div>
        <label>スープアレンジ</label>
        <select id="arrange">
          <option value="0">なし</option>
          <option value="150">極薬膳 ＋¥150</option>
          <option value="150">強壮 ＋¥150</option>
          <option value="150">トムヤム ＋¥150</option>
          <option value="150">とろとろ ＋¥150</option>
          <option value="150">担担 ＋¥150</option>
        </select>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="tabs" id="tabs">
      <button type="button" class="tab on" data-cat="all">全部</button>
      <button type="button" class="tab" data-cat="veg">野菜</button>
      <button type="button" class="tab" data-cat="mush">きのこ</button>
      <button type="button" class="tab" data-cat="tofu">豆腐・練物</button>
      <button type="button" class="tab" data-cat="other">その他</button>
    </div>
    <div id="grid" class="grid"></div>
    <div id="rows" class="rows"></div>
    <button id="reset" type="button" class="reset">全部リセット</button>
  </section>
</main>

<script>
(function(){
  var items=[
    {id:"bok",name:"青梗菜",e:"🥬",g:18,c:"veg"},
    {id:"cabbage",name:"キャベツ",e:"🥬",g:20,c:"veg"},
    {id:"lotus",name:"れんこん",e:"🪷",g:22,c:"veg"},
    {id:"tomato",name:"トマト",e:"🍅",g:28,c:"veg"},
    {id:"corn",name:"とうもろこし",e:"🌽",g:24,c:"veg"},
    {id:"broc",name:"ブロッコリー",e:"🥦",g:22,c:"veg"},
    {id:"enoki",name:"えのき",e:"🍄",g:18,c:"mush"},
    {id:"shimeji",name:"しめじ",e:"🍄",g:20,c:"mush"},
    {id:"kikurage",name:"きくらげ",e:"☁️",g:16,c:"mush"},
    {id:"tofu",name:"豆腐",e:"⬜",g:30,c:"tofu"},
    {id:"yuba",name:"湯葉",e:"🟨",g:18,c:"tofu"},
    {id:"fishball",name:"魚団子",e:"⚪",g:24,c:"tofu"},
    {id:"mochi",name:"もち巾着",e:"🟫",g:34,c:"tofu"},
    {id:"quail",name:"うずら",e:"🥚",g:12,c:"other"},
    {id:"glass",name:"板春雨",e:"🍜",g:25,c:"other"},
    {id:"seaweed",name:"わかめ",e:"🌿",g:12,c:"other"},
    {id:"dumpling",name:"水餃子",e:"🥟",g:28,c:"other"}
  ];

  var counts={};
  var cat="all";
  for(var i=0;i<items.length;i++) counts[items[i].id]=0;

  function el(id){return document.getElementById(id)}
  function yen(n){return "¥"+Math.round(n).toLocaleString("ja-JP")}
  function grams(){
    var total=0;
    for(var i=0;i<items.length;i++) total+=items[i].g*counts[items[i].id];
    return total;
  }

  function renderGrid(){
    var grid=el("grid");
    grid.innerHTML="";
    for(var i=0;i<items.length;i++){
      var x=items[i];
      if(cat!=="all" && x.c!==cat) continue;
      var b=document.createElement("button");
      b.type="button";
      b.className="item"+(counts[x.id]?" on":"");
      b.setAttribute("data-id",x.id);
      b.innerHTML='<span class="emoji">'+x.e+'</span><span class="name">'+x.name+'</span><span class="g">1タップ 約'+x.g+'g</span>'+(counts[x.id]?'<span class="count">'+counts[x.id]+'個分 選択中</span>':'');
      grid.appendChild(b);
    }
  }

  function renderRows(){
    var rows=el("rows");
    rows.innerHTML="";
    for(var i=0;i<items.length;i++){
      var x=items[i];
      if(!counts[x.id]) continue;
      var row=document.createElement("div");
      row.className="row";
      row.innerHTML='<div class="rowname">'+x.e+' '+x.name+'<small>'+counts[x.id]*x.g+'g</small></div><div class="step"><button type="button" data-id="'+x.id+'" data-d="-1">−</button><b>'+counts[x.id]+'</b><button type="button" data-id="'+x.id+'" data-d="1">＋</button></div>';
      rows.appendChild(row);
    }
  }

  function renderBowl(){
    var soup=el("soup");
    soup.innerHTML="";
    var any=false;
    for(var i=0;i<items.length;i++){
      var x=items[i];
      var n=Math.min(counts[x.id],3);
      for(var j=0;j<n;j++){
        any=true;
        var s=document.createElement("span");
        s.className="food";
        s.textContent=x.e;
        soup.appendChild(s);
      }
    }
    if(!any) soup.innerHTML='<span style="color:white;font-size:13px">具材を選んでね</span>';
  }

  function renderTotals(){
    var g=grams();
    var topping=g*3.1;
    var extra=(Number(el("spice").value)||0)+(Number(el("arrange").value)||0);
    var total=620+topping+extra;
    el("weight").textContent=g+"g";
    el("price").textContent=yen(total);
    var html="スープ＋春雨 "+yen(620)+"<br>トッピング "+yen(topping)+"（"+g+"g × ¥3.1）";
    if(extra) html+="<br>追加料金 "+yen(extra);
    el("details").innerHTML=html;
    var rem=Math.max(0,20-g);
    el("notice").textContent=rem?"20g以上になるように選んでね。あと"+rem+"g。":"20g以上クリア ✓";
    el("notice").className="notice"+(rem===0?" ok":"");
  }

  function renderAll(){
    renderGrid();
    renderRows();
    renderBowl();
    renderTotals();
  }

  el("grid").addEventListener("click",function(e){
    var b=e.target.closest("button[data-id]");
    if(!b) return;
    var id=b.getAttribute("data-id");
    counts[id]=Math.min(20,counts[id]+1);
    renderAll();
  });

  el("rows").addEventListener("click",function(e){
    var b=e.target.closest("button[data-id][data-d]");
    if(!b) return;
    var id=b.getAttribute("data-id");
    var d=Number(b.getAttribute("data-d"));
    counts[id]=Math.max(0,Math.min(20,counts[id]+d));
    renderAll();
  });

  el("tabs").addEventListener("click",function(e){
    var b=e.target.closest("button[data-cat]");
    if(!b) return;
    cat=b.getAttribute("data-cat");
    var all=document.querySelectorAll(".tab");
    for(var i=0;i<all.length;i++) all[i].classList.remove("on");
    b.classList.add("on");
    renderGrid();
  });

  el("spice").addEventListener("change",renderTotals);
  el("arrange").addEventListener("change",renderTotals);

  el("reset").addEventListener("click",function(){
    for(var i=0;i<items.length;i++) counts[items[i].id]=0;
    el("spice").selectedIndex=2;
    el("arrange").selectedIndex=0;
    renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
